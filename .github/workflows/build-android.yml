name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: expo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: expo/package-lock.json

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    # Uses the committed android/ project (same as EAS Build) rather than re-running prebuild.
    # Only the ARM ABIs are built: real phones and tablets don't need the x86 emulator ones.
    - name: Build APK
      working-directory: expo/android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: washoe-pos-apk
        path: expo/android/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
