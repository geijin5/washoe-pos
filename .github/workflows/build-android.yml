name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: expo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: expo/package-lock.json

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    # Sign with the same key as the app already installed on the devices (the Expo/EAS keystore),
    # so the APK installs as an update and keeps users, passwords and orders. Without the
    # secrets the APK is signed with the debug key and must NOT be installed over a production copy.
    - name: Set up release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "APK_ARTIFACT_NAME=washoe-pos-apk"
          } >> "$GITHUB_ENV"
          echo "Signing with the release keystore"
        else
          echo "APK_ARTIFACT_NAME=washoe-pos-apk-TEST-KEY-do-not-install-over-live-app" >> "$GITHUB_ENV"
          echo "::warning::No release keystore secrets set - APK is signed with the debug key and cannot update the installed app without uninstalling it (which deletes its users, passwords and orders)."
        fi

    # Uses the committed android/ project (same as EAS Build) rather than re-running prebuild.
    # Only the ARM ABIs are built: real phones and tablets don't need the x86 emulator ones.
    - name: Build APK
      working-directory: expo/android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APK_ARTIFACT_NAME }}
        path: expo/android/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
